# AfraKala — LAN Pilot Deployment
# فاز LAN.1 — اجرای آزمایشی روی لپ‌تاپ داخل شبکه شرکت.
#
# قواعد:
#  - بدون Caddy، بدون SSL، بدون دامنه.
#  - app روی :3000 و Supabase API (Kong) روی :8000 روی هاست publish می‌شوند
#    تا کاربران LAN از طریق http://LAN_HOST_IP:3000 و :8000 وصل شوند.
#  - Postgres و Studio پیش‌فرض publish نمی‌شوند.
#  - مقادیر از deploy/lan/.env.lan خوانده می‌شوند (در .gitignore).
#  - این stack جدا از deploy/supabase production است و آن را تغییر نمی‌دهد.
#  - فایل‌های init و kong از deploy/supabase مشترک استفاده می‌شوند
#    (read-only bind mount) تا duplication نباشد.

name: afrakala-lan

networks:
  afrakala-lan-net:
    driver: bridge

volumes:
  lan-db-data:
  lan-storage-data:

services:
  # -------------------------------------------------------------
  # App (TanStack Start SSR) — از Dockerfile اصلی پروژه build می‌شود
  # -------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        # production روی سرور اصلی، test روی کامپیوتر تست.
        # VITE_TRUSTED_HOSTS آدرس واقعی همان سرور است تا بنر هشدار قرمز نمایش داده نشود.
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_TRUSTED_HOSTS: ${VITE_TRUSTED_HOSTS:-}
        GIT_SHA: ${GIT_SHA:-local-unknown}
        BUILD_TIME: ${BUILD_TIME:-local-unknown}
        APP_ENV: lan
    image: afrakala-app:lan
    container_name: afrakala-lan-web
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      # Self-hosted Ollama. OLLAMA_API_URL / OLLAMA_MODEL / OLLAMA_API_KEY are
      # the names src/routes/api/messenger/ai-chat.ts already reads.
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      APP_SUPABASE_PUBLIC_URL: ${APP_SUPABASE_PUBLIC_URL:-}
      WHATSAPP_PLATFORM_BASE_URL: ${WHATSAPP_PLATFORM_BASE_URL:-http://192.168.170.8:8002}
      # Rows loaded by the «محصولات پرتکرار واتساپ» card. Empty = 1000 (the upstream
      # ceiling). Runtime-only, so lowering it needs a restart, not a rebuild.
      WHATSAPP_TOP_PRODUCTS_LIMIT: ${WHATSAPP_TOP_PRODUCTS_LIMIT:-}
      # Phase 10 (224) — bearer token for the recurring marketing task cron
      # endpoint (POST /api/public/hooks/generate-marketing-tasks). Server-only,
      # never VITE_ prefixed. Empty = the endpoint answers 500 and generates
      # nothing, which is the correct default for an unconfigured install.
      MARKETING_TASKS_WORKER_TOKEN: ${MARKETING_TASKS_WORKER_TOKEN:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      kong:
        condition: service_started
    networks:
      - afrakala-lan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------
  # Postgres — فقط internal. برای debug خط ports را uncomment کنید.
  # -------------------------------------------------------------
  db:
    image: supabase/postgres:15.6.1.139
    container_name: afrakala-lan-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - lan-db-data:/var/lib/postgresql/data
      - ../supabase/volumes/db/init/00-afrakala-pre-supabase-admin.sh:/docker-entrypoint-initdb.d/00-afrakala-pre-supabase-admin.sh:ro
      - ../supabase/volumes/db/init/zz-10-afrakala-roles.sh:/docker-entrypoint-initdb.d/zz-10-afrakala-roles.sh:ro
      - ../supabase/volumes/db/init/zz-20-afrakala-schemas.sql:/docker-entrypoint-initdb.d/zz-20-afrakala-schemas.sql:ro
      - ../supabase/volumes/db/init/zz-30-afrakala-jwt.sh:/docker-entrypoint-initdb.d/zz-30-afrakala-jwt.sh:ro
      - ../supabase/volumes/db/init/zzzz-99-afrakala-final-role-passwords.sh:/docker-entrypoint-initdb.d/zzzz-99-afrakala-final-role-passwords.sh:ro
    networks:
      - afrakala-lan-net
    # ports:
    #   - "127.0.0.1:5432:5432"   # فقط برای debug ادمین روی همان لپ‌تاپ

  # -------------------------------------------------------------
  # DB role password fixer — LAN-only post-start reliability layer.
  # Supabase/Postgres bootstrap can leave service roles without passwords on
  # Windows LAN volumes, so this one-shot runs a mounted script after db is
  # healthy and before auth/rest/storage/meta start.
  # -------------------------------------------------------------
  db-role-fix:
    image: supabase/postgres:15.6.1.139
    container_name: afrakala-lan-db-role-fix
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./scripts/db-role-fix.sh:/usr/local/bin/db-role-fix.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/db-role-fix.sh"]
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Auth (GoTrue)
  # -------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.158.1
    container_name: afrakala-lan-auth
    depends_on:
      db-role-fix:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # PostgREST
  # -------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: afrakala-lan-rest
    depends_on:
      db-role-fix:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Storage
  # -------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.11.13
    container_name: afrakala-lan-storage
    depends_on:
      db-role-fix:
        condition: service_completed_successfully
      rest:
        condition: service_started
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - lan-storage-data:/var/lib/storage
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Postgres Meta
  # -------------------------------------------------------------
  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: afrakala-lan-meta
    depends_on:
      db-role-fix:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Studio — پیش‌فرض خاموش. برای روشن کردن:
  #   docker compose --profile studio up -d
  # و فقط روی 127.0.0.1 publish می‌شود (نه LAN).
  # -------------------------------------------------------------
  studio:
    image: supabase/studio:20240729-ce42139
    container_name: afrakala-lan-studio
    profiles: ["studio"]
    depends_on:
      meta:
        condition: service_started
    restart: unless-stopped
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: AfraKala
      DEFAULT_PROJECT_NAME: afrakala-lan
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Kong — API gateway. روی LAN publish می‌شود تا client بتواند به Supabase وصل شود.
  # -------------------------------------------------------------
  kong:
    image: kong:2.8.1
    container_name: afrakala-lan-kong
    restart: unless-stopped
    # Kong 2.8.1 does NOT auto-substitute env vars in declarative YAML.
    # We mount kong.yml as a READ-ONLY TEMPLATE and render a runtime config
    # inside the container using sed (POSIX, available on the kong:2.8.1
    # Alpine image without bash). The rendered file lives at
    # /home/kong/kong.rendered.yml and KONG_DECLARATIVE_CONFIG points to it.
    # If substitution fails (literal placeholders survive), the container
    # exits non-zero BEFORE Kong starts, so we never serve a broken config.
    # Required because Kong otherwise loads literal "$SUPABASE_ANON_KEY" /
    # "$SUPABASE_SERVICE_KEY" as key-auth credentials and every real client
    # key is rejected with {"message":"Invalid authentication credentials"}.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        : "$${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY env var missing}"
        : "$${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY env var missing}"
        sed \
          -e "s|\$$SUPABASE_ANON_KEY|$${SUPABASE_ANON_KEY}|g" \
          -e "s|\$$SUPABASE_SERVICE_KEY|$${SUPABASE_SERVICE_KEY}|g" \
          /home/kong/kong.yml.template > /home/kong/kong.rendered.yml
        if grep -q '\$$SUPABASE_ANON_KEY\|\$$SUPABASE_SERVICE_KEY' /home/kong/kong.rendered.yml; then
          echo "[kong-entrypoint] FATAL: rendered kong.yml still contains literal placeholders" >&2
          exit 1
        fi
        exec /docker-entrypoint.sh kong docker-start
    environment:
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "8 64k"
      KONG_NGINX_HTTP_CLIENT_HEADER_BUFFER_SIZE: "64k"
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.rendered.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-changeme}
    volumes:
      # Template only. Real secrets are NEVER written into this file.
      # Create it once from the example template:
      #   cp deploy/supabase/kong.yml.example deploy/supabase/volumes/api/kong.yml
      # The container renders /home/kong/kong.rendered.yml at startup from
      # this template + env vars (see entrypoint above).
      - ../supabase/volumes/api/kong.yml:/home/kong/kong.yml.template:ro
    depends_on:
      - auth
      - rest
      - storage
      - meta
    ports:
      - "${SUPABASE_API_PORT:-8000}:8000"
    networks:
      - afrakala-lan-net
