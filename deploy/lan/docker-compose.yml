# AfraKala — LAN Pilot Deployment
# فاز LAN.1 — اجرای آزمایشی روی لپ‌تاپ داخل شبکه شرکت.
#
# قواعد:
#  - بدون Caddy، بدون SSL، بدون دامنه.
#  - app روی :3000 و Supabase API (Kong) روی :8000 روی هاست publish می‌شوند
#    تا کاربران LAN از طریق http://LAN_HOST_IP:3000 و :8000 وصل شوند.
#  - Postgres و Studio پیش‌فرض publish نمی‌شوند.
#  - مقادیر از deploy/lan/.env.lan خوانده می‌شوند (در .gitignore).
#  - این stack جدا از deploy/supabase production است و آن را تغییر نمی‌دهد.
#  - فایل‌های init و kong از deploy/supabase مشترک استفاده می‌شوند
#    (read-only bind mount) تا duplication نباشد.

name: afrakala-lan

networks:
  afrakala-lan-net:
    driver: bridge

volumes:
  lan-db-data:
  lan-storage-data:

services:
  # -------------------------------------------------------------
  # App (TanStack Start SSR) — از Dockerfile اصلی پروژه build می‌شود
  # -------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    image: afrakala-app:lan
    container_name: afrakala-lan-web
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY}
      OCR_ENABLED: ${OCR_ENABLED:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      kong:
        condition: service_started
    networks:
      - afrakala-lan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------
  # Postgres — فقط internal. برای debug خط ports را uncomment کنید.
  # -------------------------------------------------------------
  db:
    image: supabase/postgres:15.6.1.139
    container_name: afrakala-lan-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - lan-db-data:/var/lib/postgresql/data
      - ../supabase/volumes/db/init/00-afrakala-pre-supabase-admin.sh:/docker-entrypoint-initdb.d/00-afrakala-pre-supabase-admin.sh:ro
      - ../supabase/volumes/db/init/zz-10-afrakala-roles.sh:/docker-entrypoint-initdb.d/zz-10-afrakala-roles.sh:ro
      - ../supabase/volumes/db/init/zz-20-afrakala-schemas.sql:/docker-entrypoint-initdb.d/zz-20-afrakala-schemas.sql:ro
      - ../supabase/volumes/db/init/zz-30-afrakala-jwt.sh:/docker-entrypoint-initdb.d/zz-30-afrakala-jwt.sh:ro
      - ../supabase/volumes/db/init/zzzz-99-afrakala-final-role-passwords.sh:/docker-entrypoint-initdb.d/zzzz-99-afrakala-final-role-passwords.sh:ro
    networks:
      - afrakala-lan-net
    # ports:
    #   - "127.0.0.1:5432:5432"   # فقط برای debug ادمین روی همان لپ‌تاپ

  # -------------------------------------------------------------
  # DB role password fixer — LAN-only post-start reliability layer.
  # Supabase/Postgres bootstrap can leave service roles without passwords on
  # Windows LAN volumes, so this one-shot runs after db is healthy and before
  # auth/rest/storage/meta start.
  # -------------------------------------------------------------
  db-role-fix:
    image: supabase/postgres:15.6.1.139
    container_name: afrakala-lan-db-role-fix
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["/bin/bash", "-lc"]
    command: |
      set -euo pipefail

      if [ -z "$${POSTGRES_PASSWORD:-}" ] || [ "$${#POSTGRES_PASSWORD}" -lt 8 ]; then
        echo "POSTGRES_PASSWORD missing or too short" >&2
        exit 1
      fi

      export PGPASSWORD="$$POSTGRES_PASSWORD"

      psql -v ON_ERROR_STOP=1 \
        -h db \
        -U postgres \
        -d "$$POSTGRES_DB" \
        --no-psqlrc \
        -v pgpass="$$POSTGRES_PASSWORD" <<'EOSQL'
      SELECT set_config('afrakala.final_role_password', :'pgpass', false);

      DO $$$$
      DECLARE
        v_pass text := current_setting('afrakala.final_role_password', true);
      BEGIN
        IF v_pass IS NULL OR length(v_pass) < 8 THEN
          RAISE EXCEPTION 'afrakala.final_role_password missing/too short';
        END IF;

        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
          EXECUTE 'CREATE ROLE anon NOLOGIN NOINHERIT';
        ELSE
          EXECUTE 'ALTER ROLE anon WITH NOLOGIN NOINHERIT';
        END IF;

        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
          EXECUTE 'CREATE ROLE authenticated NOLOGIN NOINHERIT';
        ELSE
          EXECUTE 'ALTER ROLE authenticated WITH NOLOGIN NOINHERIT';
        END IF;

        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
          EXECUTE 'CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS';
        ELSE
          EXECUTE 'ALTER ROLE service_role WITH NOLOGIN NOINHERIT BYPASSRLS';
        END IF;

        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
          EXECUTE format('CREATE ROLE authenticator LOGIN NOINHERIT PASSWORD %L', v_pass);
        END IF;
        EXECUTE format('ALTER ROLE authenticator WITH LOGIN NOINHERIT PASSWORD %L', v_pass);

        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN
          EXECUTE format('CREATE ROLE supabase_auth_admin LOGIN NOINHERIT CREATEROLE PASSWORD %L', v_pass);
        END IF;
        EXECUTE format('ALTER ROLE supabase_auth_admin WITH LOGIN NOINHERIT CREATEROLE PASSWORD %L', v_pass);

        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_storage_admin') THEN
          EXECUTE format('CREATE ROLE supabase_storage_admin LOGIN NOINHERIT CREATEROLE PASSWORD %L', v_pass);
        END IF;
        EXECUTE format('ALTER ROLE supabase_storage_admin WITH LOGIN NOINHERIT CREATEROLE PASSWORD %L', v_pass);

        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN
          EXECUTE format('CREATE ROLE supabase_admin LOGIN SUPERUSER CREATEDB CREATEROLE REPLICATION BYPASSRLS PASSWORD %L', v_pass);
        END IF;
        EXECUTE format('ALTER ROLE supabase_admin WITH LOGIN SUPERUSER CREATEDB CREATEROLE REPLICATION BYPASSRLS PASSWORD %L', v_pass);

        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dashboard_user') THEN
          EXECUTE format('CREATE ROLE dashboard_user LOGIN CREATEDB CREATEROLE REPLICATION PASSWORD %L', v_pass);
        END IF;
        EXECUTE format('ALTER ROLE dashboard_user WITH LOGIN CREATEDB CREATEROLE REPLICATION PASSWORD %L', v_pass);

        EXECUTE 'GRANT anon, authenticated, service_role TO authenticator';
        EXECUTE format('GRANT CREATE ON DATABASE %I TO supabase_auth_admin', current_database());
        EXECUTE format('GRANT CREATE ON DATABASE %I TO supabase_storage_admin', current_database());

        IF EXISTS (SELECT 1 FROM information_schema.schemata WHERE schema_name = 'auth') THEN
          EXECUTE 'GRANT ALL PRIVILEGES ON SCHEMA auth TO supabase_auth_admin';
          EXECUTE 'ALTER SCHEMA auth OWNER TO supabase_auth_admin';
        END IF;

        IF EXISTS (SELECT 1 FROM information_schema.schemata WHERE schema_name = 'storage') THEN
          EXECUTE 'GRANT ALL PRIVILEGES ON SCHEMA storage TO supabase_storage_admin';
          EXECUTE 'ALTER SCHEMA storage OWNER TO supabase_storage_admin';
        END IF;
      END
      $$$$;

      SELECT set_config('afrakala.final_role_password', '', false);
      EOSQL

      echo "LAN DB role password fix complete"
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Auth (GoTrue)
  # -------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.158.1
    container_name: afrakala-lan-auth
    depends_on:
      db-role-fix:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # PostgREST
  # -------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: afrakala-lan-rest
    depends_on:
      db-role-fix:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Storage
  # -------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.11.13
    container_name: afrakala-lan-storage
    depends_on:
      db-role-fix:
        condition: service_completed_successfully
      rest:
        condition: service_started
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - lan-storage-data:/var/lib/storage
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Postgres Meta
  # -------------------------------------------------------------
  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: afrakala-lan-meta
    depends_on:
      db-role-fix:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Studio — پیش‌فرض خاموش. برای روشن کردن:
  #   docker compose --profile studio up -d
  # و فقط روی 127.0.0.1 publish می‌شود (نه LAN).
  # -------------------------------------------------------------
  studio:
    image: supabase/studio:20240729-ce42139
    container_name: afrakala-lan-studio
    profiles: ["studio"]
    depends_on:
      meta:
        condition: service_started
    restart: unless-stopped
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: AfraKala
      DEFAULT_PROJECT_NAME: afrakala-lan
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - afrakala-lan-net

  # -------------------------------------------------------------
  # Kong — API gateway. روی LAN publish می‌شود تا client بتواند به Supabase وصل شود.
  # -------------------------------------------------------------
  kong:
    image: kong:2.8.1
    container_name: afrakala-lan-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-changeme}
    volumes:
      # از kong.yml مشترک با production stack استفاده می‌شود.
      # فایل واقعی را از deploy/supabase/kong.yml.example بسازید:
      #   cp deploy/supabase/kong.yml.example deploy/supabase/volumes/api/kong.yml
      - ../supabase/volumes/api/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - auth
      - rest
      - storage
      - meta
    ports:
      - "${SUPABASE_API_PORT:-8000}:8000"
    networks:
      - afrakala-lan-net