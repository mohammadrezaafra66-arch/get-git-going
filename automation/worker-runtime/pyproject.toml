[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afrakala-worker-runtime"
version = "0.1.0"
description = "Minimal Worker Runtime skeleton for AfraKala Automation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "main",
  "config",
  "logger",
  "supabase_client",
  "job_claim",
  "heartbeat",
  "checkpoint",
  "job_runner",
  "shutdown",
  "phase3_controlled_evidence_insert",
  "phase3_guarded_db_evidence_contract",
  "phase3_single_row_evidence_step",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
