name: Boundary Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  boundary-guard:
    name: Boundary Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch and path boundaries
        shell: bash
        run: |
          set -euo pipefail

          HEAD_BRANCH="${{ github.head_ref }}"
          BASE_BRANCH="${{ github.base_ref }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Boundary Guard"
          echo "Head branch: ${HEAD_BRANCH}"
          echo "Base branch: ${BASE_BRANCH}"
          echo "Base SHA: ${BASE_SHA}"
          echo "Head SHA: ${HEAD_SHA}"

          git fetch origin "${BASE_SHA}" --depth=1 || true
          git fetch origin "${HEAD_SHA}" --depth=1 || true

          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" || true)"

          echo "Changed files:"
          echo "${CHANGED_FILES}"

          fail=0

          has_changes_matching() {
            local pattern="$1"
            echo "${CHANGED_FILES}" | grep -E "${pattern}" >/dev/null 2>&1
          }

          add_error() {
            local message="$1"
            echo "::error::${message}"
            fail=1
          }

          add_warning() {
            local message="$1"
            echo "::warning::${message}"
          }

          changed_route_not_api() {
            echo "${CHANGED_FILES}" | while IFS= read -r file; do
              case "${file}" in
                src/routes/api*) ;;
                src/routes/*) echo "${file}" ;;
              esac
            done | grep . >/dev/null 2>&1
          }

          # Generic secret/file safety checks.
          if has_changes_matching '(^|/)\.env($|\.)'; then
            if ! echo "${CHANGED_FILES}" | grep -E '(^|/)\.env(\.[A-Za-z0-9_-]+)?\.example$' >/dev/null 2>&1; then
              add_error "Unsafe .env file detected. Commit only .env.example templates, never real environment files."
            fi
          fi

          if has_changes_matching '(^|/).*(\.pem|\.key)$'; then
            add_error "Private key-like file detected. Do not commit .pem or .key files."
          fi

          if has_changes_matching '(^|/).*service-role.*'; then
            add_error "Service-role-like file name detected. Service role material must not be committed."
          fi

          # Root openapi is deprecated pointer-only.
          if has_changes_matching '^openapi/.*\.ya?ml$'; then
            add_error "Root openapi/ YAML is deprecated pointer-only. Use automation/openapi/automation-v1.yaml unless an ADR approves otherwise."
          fi

          # Docs/governance branches are allowed to change docs and GitHub governance files only.
          if [[ "${HEAD_BRANCH}" == docs/* || "${HEAD_BRANCH}" == docs* ]]; then
            echo "Applying docs/governance branch rules"
            NON_GOVERNANCE_FILES="$(echo "${CHANGED_FILES}" | grep -Ev '^(docs/|\.github/workflows/boundary-guard\.yml|\.github/CODEOWNERS|\.github/pull_request_template\.md)$' || true)"
            if [[ -n "${NON_GOVERNANCE_FILES}" ]]; then
              echo "Non-governance files detected:"
              echo "${NON_GOVERNANCE_FILES}"
              add_error "Docs/governance branches must only change docs/ and approved GitHub governance files."
            fi

            if [[ "${fail}" -ne 0 ]]; then
              echo "Boundary Guard failed for docs/governance branch."
              exit 1
            fi

            echo "Docs/governance branch contains only allowed governance files."
            echo "Boundary Guard passed."
            exit 0
          fi

          # Lovable branches are UI-only by default.
          if [[ "${HEAD_BRANCH}" == lovable/* ]]; then
            echo "Applying Lovable branch rules"
            if has_changes_matching '^(supabase/migrations/|automation/worker-runtime/|server/|openapi/|automation/openapi/|automation/schemas/|deploy/|\.github/workflows/)'; then
              add_error "Lovable branches are UI-only by default and must not change db, worker, server, contract, deploy, or workflow paths."
            fi
            if has_changes_matching '(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb)$'; then
              add_warning "Lovable changed a lockfile. Verify dependency change was explicitly approved."
            fi
          fi

          # Cursor worker branches must not perform broad UI work.
          if [[ "${HEAD_BRANCH}" == cursor/worker-* ]]; then
            echo "Applying Cursor worker branch rules"
            if has_changes_matching '^(src/components/|src/shared/components/)' || changed_route_not_api; then
              add_error "cursor/worker-* branches must not change broad UI paths unless a UI task explicitly approves it."
            fi
            if has_changes_matching '^supabase/migrations/'; then
              add_warning "cursor/worker-* changed migrations. Consider cursor/db-* or separate DB PR."
            fi
          fi

          # Cursor API branches may change contracts/server API, but not broad UI by default.
          if [[ "${HEAD_BRANCH}" == cursor/api-* ]]; then
            echo "Applying Cursor API branch rules"
            if has_changes_matching '^(src/components/|src/shared/components/)'; then
              add_error "cursor/api-* branches must not change broad UI components unless a UI task explicitly approves it."
            fi
            if has_changes_matching '^openapi/.*\.ya?ml$'; then
              add_error "Do not implement against root openapi/. Use automation/openapi/automation-v1.yaml."
            fi
          fi

          # Cursor DB branches should keep migration/database scope isolated.
          if [[ "${HEAD_BRANCH}" == cursor/db-* ]]; then
            echo "Applying Cursor DB branch rules"
            if has_changes_matching '^(src/components/|src/shared/components/|automation/worker-runtime/src/)'; then
              add_error "cursor/db-* branches must not change broad UI or worker runtime implementation without explicit approval."
            fi
            if changed_route_not_api; then
              add_error "cursor/db-* branches must not change broad UI routes without explicit approval."
            fi
          fi

          # Main should receive implementation via PR only; warn for unknown branch names.
          if [[ "${BASE_BRANCH}" == "main" ]]; then
            case "${HEAD_BRANCH}" in
              docs*|lovable/*|cursor/*|hotfix/*|staging)
                ;;
              *)
                add_warning "Branch name does not match the approved patterns: docs*, lovable/*, cursor/*, hotfix/*, staging. Review carefully."
                ;;
            esac
          fi

          if [[ "${fail}" -ne 0 ]]; then
            echo "Boundary Guard failed. Fix the branch/path violation or create an ADR/task packet for an approved exception."
            exit 1
          fi

          echo "Boundary Guard passed."
