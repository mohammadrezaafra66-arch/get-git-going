name: Boundary Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  boundary-guard:
    name: Boundary Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch and path boundaries
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          head_branch = os.environ.get("HEAD_BRANCH", "")
          base_branch = os.environ.get("BASE_BRANCH", "")
          base_sha = os.environ.get("BASE_SHA", "")
          head_sha = os.environ.get("HEAD_SHA", "")

          print("Boundary Guard")
          print(f"Head branch: {head_branch}")
          print(f"Base branch: {base_branch}")
          print(f"Base SHA: {base_sha}")
          print(f"Head SHA: {head_sha}")

          def run(command):
              return subprocess.run(command, text=True, capture_output=True, check=False)

          run(["git", "fetch", "origin", base_sha, "--depth=1"])
          run(["git", "fetch", "origin", head_sha, "--depth=1"])

          diff = run(["git", "diff", "--name-only", base_sha, head_sha])
          if diff.returncode != 0:
              print("::warning::Could not diff base/head SHA directly; falling back to an empty changed-file list.")
              changed_files = []
          else:
              changed_files = [line.strip() for line in diff.stdout.splitlines() if line.strip()]

          print("Changed files:")
          for file in changed_files:
              print(file)

          errors = []
          warnings = []

          def add_error(message):
              errors.append(message)
              print(f"::error::{message}")

          def add_warning(message):
              warnings.append(message)
              print(f"::warning::{message}")

          def any_match(pattern):
              return any(re.search(pattern, file) for file in changed_files)

          for file in changed_files:
              basename = file.rsplit("/", 1)[-1]

              if basename.startswith(".env") and not basename.endswith(".example"):
                  add_error("Unsafe .env file detected. Commit only .env.example templates, never real environment files.")

              if basename.endswith((".pem", ".key")):
                  add_error("Private key-like file detected. Do not commit .pem or .key files.")

              if "service-role" in file.lower():
                  add_error("Service-role-like file name detected. Service role material must not be committed.")

          if any_match(r"^openapi/.*\.ya?ml$"):
              add_error("Root openapi/ YAML is deprecated pointer-only. Use automation/openapi/automation-v1.yaml unless an ADR approves otherwise.")

          if head_branch.startswith("docs"):
              allowed_exact = {
                  ".github/workflows/boundary-guard.yml",
                  ".github/CODEOWNERS",
                  ".github/pull_request_template.md",
              }
              non_governance = [
                  file for file in changed_files
                  if not (file.startswith("docs/") or file in allowed_exact)
              ]
              if non_governance:
                  print("Non-governance files detected:")
                  for file in non_governance:
                      print(file)
                  add_error("Docs/governance branches must only change docs/ and approved GitHub governance files.")

              if errors:
                  print("Boundary Guard failed for docs/governance branch.")
                  sys.exit(1)

              print("Docs/governance branch contains only allowed governance files.")
              print("Boundary Guard passed.")
              sys.exit(0)

          if head_branch.startswith("lovable/"):
              forbidden_prefixes = (
                  "supabase/migrations/",
                  "automation/worker-runtime/",
                  "server/",
                  "openapi/",
                  "automation/openapi/",
                  "automation/schemas/",
                  "deploy/",
                  ".github/workflows/",
              )
              if any(file.startswith(forbidden_prefixes) for file in changed_files):
                  add_error("Lovable branches are UI-only by default and must not change db, worker, server, contract, deploy, or workflow paths.")
              if any(file.endswith(("package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bun.lockb")) for file in changed_files):
                  add_warning("Lovable changed a lockfile. Verify dependency change was explicitly approved.")

          if head_branch.startswith("cursor/worker-"):
              if any(file.startswith(("src/components/", "src/shared/components/")) for file in changed_files):
                  add_error("cursor/worker-* branches must not change broad UI components unless a UI task explicitly approves it.")
              if any(file.startswith("src/routes/") and not file.startswith("src/routes/api") for file in changed_files):
                  add_error("cursor/worker-* branches must not change broad UI routes unless a UI task explicitly approves it.")
              if any(file.startswith("supabase/migrations/") for file in changed_files):
                  add_warning("cursor/worker-* changed migrations. Consider cursor/db-* or separate DB PR.")

          if head_branch.startswith("cursor/api-"):
              if any(file.startswith(("src/components/", "src/shared/components/")) for file in changed_files):
                  add_error("cursor/api-* branches must not change broad UI components unless a UI task explicitly approves it.")
              if any_match(r"^openapi/.*\.ya?ml$"):
                  add_error("Do not implement against root openapi/. Use automation/openapi/automation-v1.yaml.")

          if head_branch.startswith("cursor/db-"):
              if any(file.startswith(("src/components/", "src/shared/components/", "automation/worker-runtime/src/")) for file in changed_files):
                  add_error("cursor/db-* branches must not change broad UI or worker runtime implementation without explicit approval.")
              if any(file.startswith("src/routes/") and not file.startswith("src/routes/api") for file in changed_files):
                  add_error("cursor/db-* branches must not change broad UI routes without explicit approval.")

          if base_branch == "main":
              allowed_prefixes = ("docs", "lovable/", "cursor/", "hotfix/", "staging")
              if not head_branch.startswith(allowed_prefixes):
                  add_warning("Branch name does not match approved patterns: docs*, lovable/*, cursor/*, hotfix/*, staging. Review carefully.")

          if errors:
              print("Boundary Guard failed. Fix the branch/path violation or create an ADR/task packet for an approved exception.")
              sys.exit(1)

          print("Boundary Guard passed.")
          PY
