# Build و push خودکار Docker image روی هر تغییر main
# نتیجه: ghcr.io/<owner>/<repo>-web:latest و :sha-<commit>
# روی سرور: docker compose pull && docker compose up -d web

name: Build & Push Web Image

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".lovable/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set build time
        id: build_time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT


      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
            APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Secret-leak scan on built image
        run: |
          set -e
          IMG="${{ steps.img.outputs.name }}:sha-${{ github.sha }}"
          docker pull "$IMG"
          CID=$(docker create "$IMG")
          mkdir -p /tmp/scan
          docker cp "$CID":/app/dist/client /tmp/scan/client 2>/dev/null || true
          docker rm "$CID" >/dev/null
          if [ -d /tmp/scan/client ]; then
            ! grep -RIE "SERVICE_ROLE|JWT_SECRET|POSTGRES_PASSWORD|BEGIN PRIVATE KEY|LOVABLE_API_KEY" /tmp/scan/client \
              || (echo "❌ Secret found in client bundle" && exit 1)
            echo "✅ Client bundle clean"
          else
            echo "ℹ️ No client bundle directory in image — skipping scan"
          fi

