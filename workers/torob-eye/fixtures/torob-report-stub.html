<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>ثبت گزارش ترب (stub)</title>
  </head>
  <body>
    <h1>ثبت گزارش تخلف</h1>
    <form id="report-form">
      <label for="report-text">متن گزارش</label>
      <textarea id="report-text" name="report_text" rows="8" cols="60"></textarea>
      <button id="final-submit" type="submit">ارسال گزارش</button>
    </form>
    <p id="status">ready</p>
    <script>
      window.__TOROB_STUB_SUBMITTED = false;
      document.getElementById("report-form").addEventListener("submit", function (e) {
        e.preventDefault();
        window.__TOROB_STUB_SUBMITTED = true;
        document.getElementById("status").textContent = "submitted";
      });
    </script>
  </body>
</html>
