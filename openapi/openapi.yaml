openapi: 3.0.3

info:
  title: AfraKala Assistant API
  version: 0.1.0
  license:
    name: Proprietary
    url: http://afrakala.local/legal/api-license
  description: >
    Official API contract for AfraKala Assistant.
    This file is the shared contract between Lovable UI, Cursor backend work,
    worker runtime, dashboard, and future automation modules.

servers:
  - url: http://staging-api.afrakala.local
    description: Staging API placeholder
  - url: http://api.afrakala.local
    description: Production LAN API placeholder

security:
  - bearerAuth: []

tags:
  - name: Health
    description: API health and readiness checks
  - name: Products
    description: Product catalog endpoints
  - name: Prices
    description: Pricing and calculation endpoints
  - name: WorkerJobs
    description: Worker job creation and tracking
  - name: WorkerOutputs
    description: Worker execution outputs
  - name: Bots
    description: Bot and automation status endpoints

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Check API health
      operationId: getApiHealth
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: API health check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/products:
    get:
      tags:
        - Products
      summary: Get product list
      operationId: listProducts
      parameters:
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: availableOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Product list returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/prices/calculate:
    post:
      tags:
        - Prices
      summary: Calculate product sale price
      operationId: calculatePrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceCalculationRequest"
      responses:
        "200":
          description: Price calculated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceCalculationResponse"
        "400":
          description: Invalid price calculation input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/worker/jobs:
    post:
      tags:
        - WorkerJobs
      summary: Create a worker job
      operationId: createWorkerJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerJobRequest"
      responses:
        "201":
          description: Worker job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerJob"
        "400":
          description: Invalid worker job input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/worker/jobs/{jobId}:
    get:
      tags:
        - WorkerJobs
      summary: Get worker job status
      operationId: getWorkerJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Worker job returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerJob"
        "404":
          description: Worker job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/worker/outputs:
    get:
      tags:
        - WorkerOutputs
      summary: Get worker outputs
      operationId: listWorkerOutputs
      parameters:
        - name: jobId
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
            example: torob
      responses:
        "200":
          description: Worker outputs returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOutputListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/bots/status:
    get:
      tags:
        - Bots
      summary: Get bot status list
      operationId: listBotStatuses
      responses:
        "200":
          description: Bot status list returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatusListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          example: afrakala-assistant-api
        timestamp:
          type: string
          format: date-time

    Product:
      type: object
      required:
        - id
        - name
        - brand
      properties:
        id:
          type: string
          example: prod_001
        name:
          type: string
          example: کولر گازی 24000 جنرال گلد پلاتینیوم
        brand:
          type: string
          example: General Gold
        model:
          type: string
          example: GG-S24000 PLATINUM
        category:
          type: string
          example: air_conditioner
        available:
          type: boolean
          example: true
        finalPrice:
          type: integer
          nullable: true
          example: 45000000

    ProductListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    PriceCalculationRequest:
      type: object
      required:
        - productId
        - purchasePrice
        - marginPercent
      properties:
        productId:
          type: string
          example: prod_001
        purchasePrice:
          type: integer
          example: 40000000
        marginPercent:
          type: number
          example: 10
        transportCost:
          type: integer
          default: 0
          example: 500000
        discount:
          type: integer
          default: 0
          example: 0

    PriceCalculationResponse:
      type: object
      required:
        - productId
        - finalPrice
      properties:
        productId:
          type: string
          example: prod_001
        landedCost:
          type: integer
          example: 40500000
        finalPrice:
          type: integer
          example: 44550000
        marginAmount:
          type: integer
          example: 4050000

    CreateWorkerJobRequest:
      type: object
      required:
        - type
        - source
      properties:
        type:
          type: string
          example: price_scrape
        source:
          type: string
          example: torob
        payload:
          type: object
          additionalProperties: true

    WorkerJob:
      type: object
      required:
        - id
        - type
        - source
        - status
        - createdAt
      properties:
        id:
          type: string
          example: job_001
        type:
          type: string
          example: price_scrape
        source:
          type: string
          example: torob
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    WorkerOutput:
      type: object
      required:
        - id
        - jobId
        - source
        - createdAt
      properties:
        id:
          type: string
          example: out_001
        jobId:
          type: string
          example: job_001
        source:
          type: string
          example: torob
        status:
          type: string
          example: succeeded
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    WorkerOutputListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkerOutput"

    BotStatus:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
          example: bot_torob
        name:
          type: string
          example: Torob Bot
        status:
          type: string
          enum:
            - active
            - inactive
            - error
            - paused
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          nullable: true

    BotStatusListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BotStatus"

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_input
        message:
          type: string
          example: Invalid request input.