        required: true
    environment:
      API_EXTERNAL_URL: http://192.168.170.8:9000
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:dis-0tAMYhQ-bkdBf6wTXQN037uWJDPo@db:5432/afrakala
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: xGP-EqOCnUIgt9xHqWTA7SY6aa3MHmD-Kxoj0M63k5pAUiAeUjIFC7sF7RWxRRhN
      GOTRUE_MAILER_AUTOCONFIRM: "false"
