    networks:
      afrakala-lan-net: null
    restart: unless-stopped
  caddy:
    container_name: afrakala-lan-caddy
    image: caddy:2.8-alpine
    networks:
      afrakala-lan-net: null
    ports:
      - mode: ingress
        target: 443
        published: "443"
