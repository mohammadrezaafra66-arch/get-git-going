  db:
    container_name: afrakala-lan-db
    environment:
      JWT_EXP: "3600"
      JWT_SECRET: xGP-EqOCnUIgt9xHqWTA7SY6aa3MHmD-Kxoj0M63k5pAUiAeUjIFC7sF7RWxRRhN
      POSTGRES_DB: afrakala
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: dis-0tAMYhQ-bkdBf6wTXQN037uWJDPo
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
