        read_only: true
        bind: {}
      - type: bind
        source: D:\AfraKalaTest\app\deploy\supabase\volumes\db\init\zz-10-afrakala-roles.sh
        target: /docker-entrypoint-initdb.d/zz-10-afrakala-roles.sh
        read_only: true
        bind: {}
      - type: bind
        source: D:\AfraKalaTest\app\deploy\supabase\volumes\db\init\zz-20-afrakala-schemas.sql
        target: /docker-entrypoint-initdb.d/zz-20-afrakala-schemas.sql
        read_only: true
        bind: {}
      - type: bind
        source: D:\AfraKalaTest\app\deploy\supabase\volumes\db\init\zz-30-afrakala-jwt.sh
        target: /docker-entrypoint-initdb.d/zz-30-afrakala-jwt.sh
        read_only: true
        bind: {}
      - type: bind
