        target: /docker-entrypoint-initdb.d/zzzz-99-afrakala-final-role-passwords.sh
        read_only: true
        bind: {}
  db-role-fix:
    container_name: afrakala-lan-db-role-fix
    depends_on:
      db:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/bash
      - /usr/local/bin/db-role-fix.sh
    environment:
      POSTGRES_DB: afrakala
      POSTGRES_PASSWORD: dis-0tAMYhQ-bkdBf6wTXQN037uWJDPo
    image: supabase/postgres:15.6.1.139
    networks:
      afrakala-lan-net: null
    restart: 'no'
    volumes:
      - type: bind
        source: D:\AfraKalaTest\app\deploy\lan\scripts\db-role-fix.sh
        target: /usr/local/bin/db-role-fix.sh
        read_only: true
        bind: {}
  kong:
    container_name: afrakala-lan-kong
    depends_on:
      auth:
        condition: service_started
        required: true
      meta:
        condition: service_started
        required: true
      rest:
        condition: service_started
        required: true
      storage:
        condition: service_started
        required: true
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        : "$${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY env var missing}"
        : "$${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY env var missing}"
        sed \
          -e "s|\$$SUPABASE_ANON_KEY|$${SUPABASE_ANON_KEY}|g" \
          -e "s|\$$SUPABASE_SERVICE_KEY|$${SUPABASE_SERVICE_KEY}|g" \
          /home/kong/kong.yml.template > /home/kong/kong.rendered.yml
        if grep -q '\$$SUPABASE_ANON_KEY\|\$$SUPABASE_SERVICE_KEY' /home/kong/kong.rendered.yml; then
          echo "[kong-entrypoint] FATAL: rendered kong.yml still contains literal placeholders" >&2
          exit 1
        fi
        exec /docker-entrypoint.sh kong docker-start
    environment:
      DASHBOARD_PASSWORD: changeme
      DASHBOARD_USERNAME: admin
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.rendered.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_HTTP_CLIENT_HEADER_BUFFER_SIZE: 64k
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: 8 64k
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzc5MDA1NjkxLCJleHAiOjIwOTQzNjU2OTF9.0LMk6WGniEm92wPtTnapSIcuhZpq5au8KnEUCQFPKeI
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3NzkwMDU2OTEsImV4cCI6MjA5NDM2NTY5MX0.zP9Y94wOohugV90ydmq0udAkM40xH4QehMMqy5GIW98
